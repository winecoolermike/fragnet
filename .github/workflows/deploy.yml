name: Build, refresh data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"   # about every 30 min, off-peak minutes (GitHub may delay scheduled runs; backup trigger: see README)

permissions:
  contents: write   # only used to append roundups/ and rankings/YYYY-wNN.json
  discussions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # v4.5: the first run draws every share image (later runs reuse the cache)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dist/ (site files + committed data)
        env:
          # optional visitor counter: inert until the repository variable GOATCOUNTER_CODE is set
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python build_dist.py

      - name: Restore last-good data from cache
        id: lastgood
        uses: actions/cache/restore@v6
        with:
          path: .lastgood
          key: lastgood-${{ github.run_id }}
          restore-keys: |
            lastgood-

      - name: Use the newer of cached vs committed data as last-good
        run: |
          python - <<'PY'
          import json, os, shutil
          def stamp(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      d = json.load(fh)
                  return (d.get("fetched_at") or "") if isinstance(d, dict) else ""
              except (OSError, ValueError):
                  return ""
          # data.json + the lazy side files (teams.json: rosters/player stats, val.json:
          # Valorant players/rosters - its cached rosters and event stats save requests)
          for name in ("data.json", "teams.json", "val.json"):
              cached, committed = stamp(f".lastgood/{name}"), stamp(f"dist/{name}")
              print(f"{name}: cached last-good: {cached or 'none'} | committed: {committed or 'none'}")
              if cached and cached > committed:
                  shutil.copy(f".lastgood/{name}", f"dist/{name}")
                  print(f"  using cached last-good {name}")
              else:
                  print(f"  using committed {name}")
          PY

      - name: Fetch fresh data into dist/
        id: fetch
        continue-on-error: true
        env:
          # optional; empty until the repo secret exists (fetch_data.py then skips the Data API)
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
        run: python fetch_data.py --out dist

      - name: Ensure data.js matches data.json
        run: |
          python - <<'PY'
          import json
          with open("dist/data.json", encoding="utf-8") as fh:
              data = json.load(fh)
          blob = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
          expected = "window.FRAGNET_DATA = " + blob.replace("</", "<\\/") + ";\n"
          try:
              with open("dist/data.js", encoding="utf-8") as fh:
                  current = fh.read()
          except OSError:
              current = ""
          pre = "window.FRAGNET_DATA = "
          try:
              same = json.loads(current.strip()[len(pre):-1].replace("<\\/", "</")) == data
          except ValueError:
              same = False
          if not same:
              with open("dist/data.js", "w", encoding="utf-8") as fh:
                  fh.write(expected)
              print("data.js regenerated from data.json")
          else:
              print("data.js matches data.json")
          print("data fetched_at:", data.get("fetched_at"))
          # lazy side files (a cached last-good .json may have been restored without its .js)
          import os
          for name, var in (("teams", "FRAGNET_TEAMS"), ("val", "FRAGNET_VAL")):
              jp, sp = f"dist/{name}.json", f"dist/{name}.js"
              if not os.path.exists(jp):
                  continue
              with open(jp, encoding="utf-8") as fh:
                  side = json.load(fh)
              blob = json.dumps(side, ensure_ascii=False, separators=(",", ":"))
              want = f"window.{var} = " + blob.replace("</", "<\\/") + ";\n"
              try:
                  with open(sp, encoding="utf-8") as fh:
                      cur = fh.read().strip()
                  same = json.loads(cur[len(f"window.{var} = "):-1].replace("<\\/", "</")) == side
              except (OSError, ValueError):
                  same = False
              if not same:
                  with open(sp, "w", encoding="utf-8") as fh:
                      fh.write(want)
                  print(f"{name}.js regenerated from {name}.json")
          PY
          python build_dist.py --check

      - name: Reviewed team extras (teams-extra.json)
        continue-on-error: true
        run: python teams_extra.py dist --src teams-extra.json

      - name: ESB Team Ranking and Player Rating (v6) + experimental win probability (v6.5)
        continue-on-error: true
        env:
          ESB_PRED_REGIONS: NA   # US first; "NA,EU" would add EU Main later
          # Nov 13, 2026: win probability stays PAUSED (the preview shows the "Paused" note); "0" here would switch it on
          ESB_PRED_PAUSED: "1"
          # quality gate if ever unpaused: hide estimates while the walk-forward backtest is no better than a coin flip
          ESB_PRED_REQUIRE_SKILL: "1"
        run: python ranking.py dist --archive rankings

      - name: Per-region lazy team files (teams-na.js, teams-eu.js)
        continue-on-error: true   # the app falls back to the whole teams.js
        run: python split_teams.py dist

      - name: Spotlights and weekly roundups
        continue-on-error: true
        run: python spotlight.py dist --archive roundups

      # also the full-season match history (data/esea-s<N>-matches.json, history.py): fetch_data.py rewrites it
      # at most every 6 h (or while the backfill moves), so this adds a few small commits a day
      - name: Archive finished roundup weeks and season match history (append-only commit)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for d in roundups rankings data; do [ -d $d ] && ls $d/*.json >/dev/null 2>&1 && git add $d/*.json; done
          git diff --cached --quiet && { echo "no new roundup weeks or match history"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "archive finished weeks and season match history (roundups, rankings, data) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1

      - name: Community config and forum list (GitHub Discussions)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GISCUS_ENABLED: ${{ vars.GISCUS_ENABLED }}
          DISCORD_INVITE: ${{ vars.DISCORD_INVITE }}
        run: python discussions.py dist

      - name: Restore share-image cache
        uses: actions/cache/restore@v6
        with:
          path: .ogcache
          key: ogcache-${{ github.run_id }}
          restore-keys: |
            ogcache-

      # v4.5 real path pages (team/, player/, match/ and section folders), sitemap.xml, robots.txt and
      # 1200x630 share images (drawn only for changed entities). Optional: on any failure the generated
      # files are removed and the hash-only site is deployed.
      - name: Path pages, sitemap and share images
        id: pages
        continue-on-error: true
        env:
          # public base URL (canonical, og:url, sitemap, robots, share images); empty = the github.io URL
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_LIST: /tmp/indexnow-urls.txt   # changed URLs for the IndexNow ping (outside dist/, never published)
        run: |
          cp dist/index.html /tmp/index.nopages.html
          start=$(date +%s)
          if ! { python pages.py dist --og-cache .ogcache && python build_dist.py --check > /dev/null; }; then
            rm -rf dist/team dist/player dist/match dist/cs2 dist/valorant dist/wow dist/news dist/og dist/sitemap.xml dist/robots.txt dist/api dist/llms.txt dist/llms-full.txt dist/og.png
            cp /tmp/index.nopages.html dist/index.html
            echo "::warning::path pages failed - deploying the hash-only site"
          fi
          echo "pages step: $(( $(date +%s) - start ))s, dist $(du -sh dist | cut -f1), $(find dist -type f | wc -l) files"

      - name: Save share-image cache
        if: steps.pages.outputs.og_drawn != '' && steps.pages.outputs.og_drawn != '0'
        uses: actions/cache/save@v6
        with:
          path: .ogcache
          key: ogcache-${{ github.run_id }}-${{ github.run_attempt }}

      # v3.7 no-JS fallback: static front-page snapshot from the final data.json.
      # Optional: on any failure the plain index.html (JS-only) is deployed.
      - name: Prerender static snapshot
        continue-on-error: true
        run: |
          cp dist/index.html /tmp/index.plain.html
          if ! { python prerender.py dist/index.html dist/data.json && python build_dist.py --check; }; then
            cp /tmp/index.plain.html dist/index.html
            echo "::warning::prerender failed - deploying the JavaScript-only index.html"
          fi

      - name: Save last-good data to cache
        if: steps.fetch.outcome == 'success'
        run: |
          mkdir -p .lastgood && cp dist/data.json .lastgood/data.json
          for f in teams.json val.json; do if [ -f "dist/$f" ]; then cp "dist/$f" ".lastgood/$f"; fi; done

      - name: Upload last-good cache
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .lastgood
          key: lastgood-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=esportsscoreboard --branch=main

      # Nov 13 SEO pass: tell IndexNow (Bing, Yandex, Seznam, Naver...) about pages that changed in the last ~36h.
      # Once a day (the first refresh after 14:00 UTC) and on pushes, so the 30-minute refreshes don't spam it. Never fails the deploy.
      - name: Ping IndexNow
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "push" ] && { [ "$(date -u +%H)" != "14" ] || [ "$(date -u +%M)" -ge 30 ]; }; then echo "not the daily ping slot"; exit 0; fi
          KEY=$(python -c 'import seo;print(seo.INDEXNOW_KEY)')
          HOST=$(python -c 'import pages,urllib.parse;print(urllib.parse.urlparse(pages.SITE).netloc)')
          URLS=$( (grep -v '^$' /tmp/indexnow-urls.txt 2>/dev/null || true) | head -1000 | python -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin]))')
          if [ "$URLS" = "[]" ]; then URLS="[\"https://$HOST/\"]"; fi
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}"
